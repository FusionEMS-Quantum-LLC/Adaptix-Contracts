name: semgrep-security

# THE NATIVE SEMGREP GATE (QOD-005), rendered by adaptix-ops
# scripts/lib/securityBackstopNative.ts. Do not edit it by hand: render it again.
# A public repository cannot call a reusable workflow kept in a private
# repository, so this repository carries the gate's one job itself. The job
# below is the scan job of that reusable workflow, unchanged, at the commit
# named here:
# source: FusionEMS-Quantum-LLC/adaptix-ops/.github/workflows/semgrep-reusable.yml@0baf90c27e46f83a2d18ff02bce7c77ad403570e
# It publishes the check
# "adaptix/semgrep-security / scan".

on:
  pull_request:
  # A required check must report on the merge queue's synthetic ref, or the
  # queue stalls instead of failing.
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a merge-group run: a cancelled required check dequeues it.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  scan:
    name: adaptix/semgrep-security / scan
    runs-on: ubuntu-latest
    # The required-path ceiling (config/platform-standard.yaml
    # requiredCriticalPathTimeoutMinutes); npm test keeps this at or below it.
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      actions: read
    env:
      SEMGREP_VERSION: "1.177.0"
      SEMGREP_SEND_METRICS: "off"
      SEMGREP_ENABLE_VERSION_CHECK: "0"
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: Refuse an untrusted trigger or a fork
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          case "${EVENT}" in
            pull_request|merge_group|push|workflow_dispatch) ;;
            *)
              echo "::error title=adaptix/semgrep-security::event ${EVENT} is refused; only pull_request, merge_group, push and workflow_dispatch may run the Semgrep gate (never pull_request_target)."
              exit 1
              ;;
          esac
          if [ "${EVENT}" = "pull_request" ] && [ "${HEAD_REPOSITORY}" != "${REPOSITORY}" ]; then
            echo "::error title=adaptix/semgrep-security::pull request from fork ${HEAD_REPOSITORY} is refused: its read-only token cannot publish this gate's evidence, so it is never reported as scanned."
            exit 1
          fi

      - name: Check out the revision under analysis
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # github.sha: the merge commit a pull request would produce, the merge
          # group's commit, or the pushed/dispatched commit. The SARIF is
          # uploaded against the same commit.
          persist-credentials: false

      - name: Set up the pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install the pinned Semgrep from hash-locked wheels
        shell: bash
        run: |
          set -euo pipefail
          venv="${RUNNER_TEMP}/semgrep-venv"
          lock="${RUNNER_TEMP}/semgrep-requirements.txt"
          cat > "${lock}" <<'ADAPTIX_SEMGREP_LOCK'
