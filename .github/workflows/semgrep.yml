      - name: Run the ruleset over its fixtures
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/semgrep"
          cd "${root}/fixtures"
          # An explicit, empty ignore file: Semgrep's built-in defaults would
          # skip tests/, and the negative fixtures there must be analysed.
          echo "# Adaptix self-test: nothing is ignored." > .semgrepignore
          # The findings on the fixtures are expected by construction; only the JSON
          # report is read, so the text listing is not printed.
          semgrep scan --config "${root}/adaptix-python.yml" --metrics=off --disable-version-check --disable-nosem --no-rewrite-rule-ids --strict --quiet --json-output="${root}/out/self-test.json" . > /dev/null

      - name: Require every rule to fire exactly where its fixtures say
        shell: node {0}
        env:
          SEMGREP_ROOT: ${{ runner.temp }}/semgrep
        run: |
          const fs = require("fs");
          const path = require("path");
          const root = process.env.SEMGREP_ROOT;
          const fixtures = path.join(root, "fixtures");
          const norm = (file) => String(file).replace(/\\/gu, "/").replace(/^\.\//u, "");
          const errors = [];
          let report = null;
          try {
            report = JSON.parse(fs.readFileSync(path.join(root, "out", "self-test.json"), "utf8"));
          } catch (error) {
            errors.push(`no readable self-test report (${error.message})`);
          }
          const ruleIds = [...fs.readFileSync(path.join(root, "adaptix-python.yml"), "utf8").matchAll(/^ {2}- id: (\S+)$/gmu)].map((match) => match[1]);
          if (ruleIds.length === 0) errors.push("the ruleset declares no rule");
          const expected = new Map();
          const files = [];
          const walk = (dir) => {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (entry.name.endsWith(".py")) files.push(full);
            }
          };
          walk(fixtures);
          for (const file of files) {
            const relative = norm(path.relative(fixtures, file));
            fs.readFileSync(file, "utf8").split(/\r?\n/u).forEach((line, index) => {
              const match = /#\s*ruleid:\s*(.+)$/u.exec(line);
              if (match === null) return;
              const key = `${relative}:${index + 2}`;
              const ids = expected.get(key) ?? new Set();
              for (const id of match[1].split(",")) ids.add(id.trim());
              expected.set(key, ids);
            });
          }
          const found = new Map();
          if (report !== null) {
            if (report.version !== process.env.SEMGREP_VERSION) errors.push(`self-test ran Semgrep ${report.version}, not ${process.env.SEMGREP_VERSION}`);
            for (const error of report.errors ?? []) errors.push(`Semgrep error on its own fixtures: ${JSON.stringify(error.type)} ${String(error.message ?? "").split("\n")[0]}`);
            for (const rule of report.skipped_rules ?? []) errors.push(`rule ${rule.rule_id ?? JSON.stringify(rule)} was skipped`);
            const scanned = new Set((report.paths?.scanned ?? []).map(norm));
            for (const file of files) if (!scanned.has(norm(path.relative(fixtures, file)))) errors.push(`fixture ${norm(path.relative(fixtures, file))} was not analysed`);
            for (const result of report.results ?? []) {
              const key = `${norm(result.path)}:${result.start?.line}`;
              const ids = found.get(key) ?? new Set();
              ids.add(result.check_id);
              found.set(key, ids);
            }
          }
          for (const [key, ids] of expected) for (const id of ids) if (!(found.get(key) ?? new Set()).has(id)) errors.push(`${id} did not fire at ${key}`);
          for (const [key, ids] of found) for (const id of ids) if (!(expected.get(key) ?? new Set()).has(id)) errors.push(`${id} fired at ${key}, where no fixture expects it`);
          const covered = new Set([...expected.values()].flatMap((ids) => [...ids]));
          for (const id of ruleIds) if (!covered.has(id)) errors.push(`rule ${id} has no fixture that proves it fires`);
          for (const id of covered) if (!ruleIds.includes(id)) errors.push(`a fixture names ${id}, which is not in the ruleset`);
          const pairs = [...expected.values()].reduce((total, ids) => total + ids.size, 0);
          console.log(`self-test: ${ruleIds.length} rule(s), ${pairs} expected finding(s) over ${files.length} fixture file(s).`);
          for (const message of errors) console.log(`::error title=adaptix/semgrep-security::ruleset self-test: ${message}`);
          process.exitCode = errors.length === 0 ? 0 : 1;

      - name: Fix the analysis scope centrally
        shell: bash
        run: |
          set -euo pipefail
          # Repository .semgrepignore files are not honoured; this is the whole
          # scope. The floor re-derives it from `git ls-files`, so keep the two
          # lists equal (npm test checks).
          find . -path ./.git -prune -o -name .semgrepignore -type f -print -exec rm -f {} +
          cat > .semgrepignore <<'ADAPTIX_SEMGREP_SCOPE'
          .git/
          node_modules/
          .venv/
          venv/
          .tox/
          .nox/
          __pypackages__/
          site-packages/
          ADAPTIX_SEMGREP_SCOPE

      - name: Scan with the pinned ruleset
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/semgrep"
          # No --error: findings are judged by severity in the next step. Any
          # other failure is Semgrep's own non-zero exit, which fails here.
          semgrep scan --config "${root}/adaptix-python.yml" --metrics=off --disable-version-check --disable-nosem --no-rewrite-rule-ids --timeout 30 --json-output="${root}/out/semgrep.json" --sarif-output="${root}/out/semgrep.sarif" .

      - name: Enforce the platform floor
        shell: node {0}
        env:
          SEMGREP_JSON: ${{ runner.temp }}/semgrep/out/semgrep.json
          SEMGREP_SARIF: ${{ runner.temp }}/semgrep/out/semgrep.sarif
          SEMGREP_CODE_SCANNING_SARIF: ${{ runner.temp }}/semgrep/out/semgrep.code-scanning.sarif
          SEMGREP_VERDICT: ${{ runner.temp }}/semgrep/out/verdict.json
        run: |
          const fs = require("fs");
          const { execFileSync } = require("child_process");
          const SEVERITIES = ["ERROR", "WARNING", "INFO"];
          // Partial parsing: Semgrep analysed the file with error recovery. Every
          // other error type (rule errors, timeouts, files it could not parse)
          // means part of the ruleset did not run somewhere, which fails.
          const BENIGN_ERROR_TYPES = new Set(["PartialParsing"]);
          // The central .semgrepignore, by path segment. npm test holds the two equal.
          const EXCLUDED_SEGMENTS = [".git", "node_modules", ".venv", "venv", ".tox", ".nox", "__pypackages__", "site-packages"];
          const MAX_TARGET_BYTES = 1000000;
          // `nosemgrep: <rule ids>` anywhere in the line's comment, so a
          // justification may stand before or after the ids.
          const SUPPRESSION = /#.*?\bnosem(?:grep)?\s*:\s*([A-Za-z0-9_.,\s-]+)/u;
          const BARE = /#.*?\bnosem(?:grep)?\b(?!\s*:)/u;
          const norm = (path) => String(path).replace(/\\/gu, "/").replace(/^\.\//u, "");
          const errors = [];
          const notes = [];
          let report = null;
          try {
            report = JSON.parse(fs.readFileSync(process.env.SEMGREP_JSON, "utf8"));
          } catch (error) {
            errors.push(`no readable Semgrep JSON report at ${process.env.SEMGREP_JSON} (${error.message}); a scan without a report is not a pass`);
          }
          if (report !== null) {
            if (report.version !== process.env.SEMGREP_VERSION) errors.push(`the report was written by Semgrep ${report.version}, not the pinned ${process.env.SEMGREP_VERSION}`);
            if (!Array.isArray(report.results) || !Array.isArray(report.errors) || !Array.isArray(report.paths?.scanned)) errors.push("the report carries no results, errors or paths.scanned array");
            for (const rule of report.skipped_rules ?? []) errors.push(`rule ${rule.rule_id ?? JSON.stringify(rule)} was skipped, so part of the ruleset never ran`);
          }
          const results = Array.isArray(report?.results) ? report.results : [];
          const scanned = new Set((Array.isArray(report?.paths?.scanned) ? report.paths.scanned : []).map(norm));
          if (report !== null && scanned.size === 0) errors.push("Semgrep analysed no file; a scan of nothing is not a pass");
          const partial = [];
          for (const error of Array.isArray(report?.errors) ? report.errors : []) {
            const type = Array.isArray(error.type) ? error.type[0] : error.type;
            const where = norm(error.path ?? error.spans?.[0]?.file ?? "");
            if (BENIGN_ERROR_TYPES.has(type) && error.level === "warn") {
              partial.push(where);
              continue;
            }
            const rule = error.rule_id ? ` (rule ${error.rule_id})` : "";
            errors.push(`Semgrep ${error.level ?? "unlevelled"} error ${type}${where ? ` in ${where}` : ""}${rule}: ${String(error.message ?? "").split("\n")[0]}`);
          }

          // Coverage: every tracked Python file in scope must have been analysed.
          const oversized = [];
          const missed = [];
          if (report !== null) {
            const tracked = execFileSync("git", ["ls-files", "-z", "--", "*.py", "*.pyi"], { encoding: "utf8" }).split("\0").filter(Boolean);
            for (const file of tracked) {
              if (file.split("/").some((segment) => EXCLUDED_SEGMENTS.includes(segment))) continue;
              if (scanned.has(file)) continue;
              let stat = null;
              try {
                stat = fs.lstatSync(file);
              } catch {
                stat = null;
              }
              if (stat !== null && stat.isSymbolicLink()) continue;
              if (stat !== null && stat.size > MAX_TARGET_BYTES) {
                oversized.push(file);
                continue;
              }
              missed.push(file);
            }
          }
          if (missed.length > 0) errors.push(`${missed.length} tracked Python file(s) in scope were not analysed: ${missed.slice(0, 20).join(", ")}`);

          // Findings, with rule-scoped in-source suppression only.
          const sources = new Map();
          const linesOf = (file) => {
            if (!sources.has(file)) {
              let text = "";
              try {
                text = fs.readFileSync(file, "utf8");
              } catch {
                text = "";
              }
              sources.set(file, text.split(/\r?\n/u));
            }
            return sources.get(file);
          };
          const suppressionFor = (finding) => {
            const lines = linesOf(norm(finding.path));
            const start = Number(finding.start?.line ?? 0);
            const candidates = [start];
            if (/^\s*#/u.test(lines[start - 2] ?? "")) candidates.push(start - 1);
            for (const number of candidates) {
              const match = SUPPRESSION.exec(lines[number - 1] ?? "");
              if (match !== null && match[1].split(/[\s,]+/u).filter(Boolean).includes(finding.check_id)) return `nosemgrep: ${finding.check_id} (line ${number})`;
            }
            if (candidates.some((number) => BARE.test(lines[number - 1] ?? ""))) notes.push(`${norm(finding.path)}:${start} carries a bare nosemgrep, which names no rule and suppresses nothing`);
            return null;
          };
          const perRule = new Map();
          const blocking = [];
          const suppressed = new Map();
          let unrecognised = 0;
          for (const finding of results) {
            const severity = finding.extra?.severity;
            if (!SEVERITIES.includes(severity)) {
              unrecognised += 1;
              continue;
            }
            const row = perRule.get(finding.check_id) ?? { severity, findings: 0, suppressed: 0 };
            row.findings += 1;
            const location = `${norm(finding.path)}:${finding.start?.line}`;
            const suppression = severity === "ERROR" ? suppressionFor(finding) : null;
            if (suppression !== null) {
              row.suppressed += 1;
              suppressed.set(`${finding.check_id}|${norm(finding.path)}|${finding.start?.line}`, suppression);
            } else if (severity === "ERROR") {
              blocking.push(`${finding.check_id} at ${location}`);
            }
            perRule.set(finding.check_id, row);
          }
          if (unrecognised > 0) errors.push(`${unrecognised} finding(s) carry no ERROR, WARNING or INFO severity, so they cannot be proven below High`);
          if (blocking.length > 0) errors.push(`${blocking.length} ERROR (High) finding(s): ${blocking.slice(0, 20).join("; ")}`);

          // The SARIF for code scanning: the same results, High/Medium/Low
          // security severities, rule-scoped suppressions marked, and the
          // login-gated "requires login" fingerprint values Semgrep writes
          // without an account removed (every result would share one value).
          let sarif = null;
          try {
            sarif = JSON.parse(fs.readFileSync(process.env.SEMGREP_SARIF, "utf8"));
          } catch (error) {
            errors.push(`no readable SARIF report at ${process.env.SEMGREP_SARIF} (${error.message})`);
          }
          if (sarif !== null) {
            const runs = Array.isArray(sarif.runs) ? sarif.runs : [];
            const sarifResults = runs.reduce((total, run) => total + (Array.isArray(run.results) ? run.results.length : 0), 0);
            if (runs.length === 0) errors.push("the SARIF report holds no run");
            if (sarifResults !== results.length) errors.push(`the SARIF holds ${sarifResults} result(s) and the JSON ${results.length}; the two reports disagree`);
            for (const run of runs) {
              for (const rule of run.tool?.driver?.rules ?? []) {
                const level = rule.defaultConfiguration?.level;
                rule.properties = { ...(rule.properties ?? {}), "security-severity": level === "error" ? "8.0" : level === "warning" ? "5.0" : "2.0" };
              }
              for (const result of Array.isArray(run.results) ? run.results : []) {
                if (result.fingerprints && Object.values(result.fingerprints).every((value) => value === "requires login")) delete result.fingerprints;
                const location = result.locations?.[0]?.physicalLocation;
                const key = `${result.ruleId}|${norm(location?.artifactLocation?.uri ?? "")}|${location?.region?.startLine}`;
                // Only this floor's own acceptances leave marked as suppressed.
                // Semgrep marks every match a nosem comment covers as an
                // inSource suppression -- a bare `# nosemgrep`, a rule id it
                // matches by suffix, a WARNING or INFO finding -- although the
                // floor accepted none of them (see SUPPRESSION IS RULE-SCOPED);
                // left in, the uploaded SARIF would call them accepted.
                if (suppressed.has(key)) result.suppressions = [{ kind: "inSource", justification: suppressed.get(key) }];
                else delete result.suppressions;
              }
            }
            fs.writeFileSync(process.env.SEMGREP_CODE_SCANNING_SARIF, JSON.stringify(sarif));
          }

          const rows = [...perRule.entries()].sort(([a], [b]) => a.localeCompare(b)).map(([rule, row]) => `| ${rule} | ${row.severity} | ${row.findings} | ${row.suppressed} |`);
          const status = errors.length === 0 ? "PASS" : "FAIL";
          const summary = [
            "### adaptix/semgrep-security",
            "",
            `Semgrep ${report?.version ?? "unknown"}; ${scanned.size} file(s) analysed; ${results.length} finding(s).`,
            "",
            "| Rule | Severity | Findings | Suppressed (rule-scoped) |",
            "| --- | --- | --- | --- |",
            ...(rows.length > 0 ? rows : ["| (none) | | 0 | 0 |"]),
            "",
            ...(partial.length > 0 ? [`Partially parsed (analysed with error recovery): ${partial.join(", ")}`, ""] : []),
            ...(oversized.length > 0 ? [`Not analysed, over the 1 MB target limit: ${oversized.join(", ")}`, ""] : []),
            ...notes.map((note) => `Note: ${note}`),
            "",
            status === "PASS" ? "Platform floor: PASS (no unsuppressed ERROR finding, no tool error)." : `Platform floor: FAIL -- ${errors.join("; ")}.`,
            "",
          ].join("\n");
          fs.writeFileSync(process.env.SEMGREP_VERDICT, JSON.stringify({ status, errors, blocking, suppressed: [...suppressed.values()], partial, oversized, missed, notes }, null, 2));
          if (process.env.GITHUB_STEP_SUMMARY) fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
          console.log(summary);
          for (const message of errors) console.log(`::error title=adaptix/semgrep-security::${message}`);
          process.exitCode = errors.length === 0 ? 0 : 1;

      - name: Archive the Semgrep evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: adaptix-semgrep-security-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/semgrep/out/
          if-no-files-found: error
          # Kept for the repository's own artifact retention (the organisation
          # maximum); code scanning keeps the SARIF beyond it.

      # Never from a merge group: see NO CODE-SCANNING UPLOAD FROM A MERGE GROUP.
      - name: Publish the SARIF evidence to code scanning
        if: ${{ !cancelled() && true && github.event_name != 'merge_group' }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: ${{ runner.temp }}/semgrep/out/semgrep.code-scanning.sarif
          category: semgrep

      # ACCEPTED IN SOURCE IS DISMISSED IN CODE SCANNING (adaptix-ops #1533).
      # Code scanning stores a SARIF result's `suppressions` but never changes
      # an alert's state from it, so a finding accepted with a rule-scoped
      # `nosemgrep: <rule id>` stayed an OPEN alert for ever, and the fleet
      # governance lane check:security counts open alerts as blocking:
      # Adaptix-Crew-Service analysis 1871820966 (main d6396c61) holds the
      # suppressed stream_ticket.py:98 result while alert #1 is still open.
      # On a push to the default branch -- the ref check:security reads -- this
      # dismisses, as "won't fix" with the recorded justification, each open
      # Semgrep alert whose finding this run accepted in source, and reopens
      # each alert this step once dismissed whose finding is reported again
      # WITHOUT an accepted suppression. Nothing else is touched: an alert
      # dismissed by a person is left alone (a reopen needs this step's words
      # AND github-actions[bot] as the dismisser), and an unsuppressed finding
      # is never dismissed. Accepted means accepted by the floor: a suppression
      # Semgrep itself wrote (a bare nosemgrep, a WARNING finding) is removed
      # by the floor and does not count here. Every API error fails the step.
      - name: Dismiss the code-scanning alerts of findings accepted in source
        if: ${{ !cancelled() && true && github.event_name == 'push' }}
        shell: node {0}
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SEMGREP_CODE_SCANNING_SARIF: ${{ runner.temp }}/semgrep/out/semgrep.code-scanning.sarif
        run: |
          const fs = require("fs");
          const PREFIX = "adaptix/semgrep-security: accepted in source";
          const TOOL = "Semgrep OSS";
          const MAX_PAGES = 20;
          // The identity behind github.token, as the REST API reports a user:
          // this step's own dismissals carry it, a person's never do.
          const STEP_ACTOR = { login: "github-actions[bot]", type: "Bot" };
          // The floor's path form, so a SARIF uri of "./app/x.py" meets the
          // alert's "app/x.py".
          const norm = (path) => String(path).replace(/\\/gu, "/").replace(/^\.\//u, "");
          const { API_URL, REPOSITORY, REF, DEFAULT_BRANCH, GH_TOKEN, SEMGREP_CODE_SCANNING_SARIF } = process.env;
          const main = async () => {
            if (!DEFAULT_BRANCH || REF !== `refs/heads/${DEFAULT_BRANCH}`) {
              console.log(`Not the default branch (${REF}); alert states are reconciled on the default branch only.`);
              return;
            }
            if (!GH_TOKEN || !API_URL || !REPOSITORY) throw new Error("GH_TOKEN, API_URL and REPOSITORY are required");
            const sarif = JSON.parse(fs.readFileSync(SEMGREP_CODE_SCANNING_SARIF, "utf8"));
            const accepted = new Map();
            const reported = new Set();
            for (const run of Array.isArray(sarif.runs) ? sarif.runs : []) {
              for (const result of Array.isArray(run.results) ? run.results : []) {
                const location = result.locations?.[0]?.physicalLocation;
                const key = `${result.ruleId}|${norm(location?.artifactLocation?.uri ?? "")}|${location?.region?.startLine}`;
                reported.add(key);
                // Accepted only in the floor's own words for this rule, the
                // whole justification "nosemgrep: <rule id> (line N)" and
                // nothing else. The floor removes every other suppression.
                const suppression = (result.suppressions ?? []).find((entry) => {
                  if (entry?.kind !== "inSource" || (entry.status !== undefined && entry.status !== "accepted")) return false;
                  const words = typeof entry.justification === "string" ? /^nosemgrep: (\S+) \(line \d+\)$/u.exec(entry.justification) : null;
                  return words !== null && words[1] === result.ruleId;
                });
                if (suppression !== undefined) accepted.set(key, suppression.justification);
              }
            }
            const call = async (method, path, body) => {
              const response = await fetch(`${API_URL}${path}`, {
                method,
                headers: { Accept: "application/vnd.github+json", Authorization: `Bearer ${GH_TOKEN}`, "X-GitHub-Api-Version": "2022-11-28", ...(body ? { "Content-Type": "application/json" } : {}) },
                body: body ? JSON.stringify(body) : undefined,
              });
              const text = await response.text();
              if (!response.ok) throw new Error(`${method} ${path} answered ${response.status}: ${text.slice(0, 300)}`);
              return text ? JSON.parse(text) : null;
            };
            // Only the alerts this step can act on, listed by state, so a long
            // history of fixed alerts cannot use up the page limit.
            const alerts = [];
            for (const state of ["open", "dismissed"]) {
              for (let page = 1; ; page += 1) {
                if (page > MAX_PAGES) throw new Error(`more than ${MAX_PAGES * 100} ${state} ${TOOL} alerts; refusing to act on a partial list`);
                const batch = await call("GET", `/repos/${REPOSITORY}/code-scanning/alerts?tool_name=${encodeURIComponent(TOOL)}&ref=${encodeURIComponent(REF)}&state=${state}&per_page=100&page=${page}`);
                if (!Array.isArray(batch)) throw new Error("the alert list is not an array");
                alerts.push(...batch);
                if (batch.length < 100) break;
              }
            }
            const keyOf = (alert) => `${alert.rule?.id}|${alert.most_recent_instance?.location?.path ?? ""}|${alert.most_recent_instance?.location?.start_line}`;
            let dismissed = 0;
            let reopened = 0;
            for (const alert of alerts) {
              const key = keyOf(alert);
              if (alert.state === "open" && accepted.has(key)) {
                const comment = `${PREFIX} (${accepted.get(key)})`.slice(0, 280);
                await call("PATCH", `/repos/${REPOSITORY}/code-scanning/alerts/${alert.number}`, { state: "dismissed", dismissed_reason: "won't fix", dismissed_comment: comment });
                console.log(`dismissed #${alert.number} ${key}`);
                dismissed += 1;
              } else if (
                alert.state === "dismissed" &&
                // This step's own dismissal: its words AND its identity. A
                // person whose comment happens to start the same way is left
                // alone.
                String(alert.dismissed_comment ?? "").startsWith(PREFIX) &&
                alert.dismissed_by?.login === STEP_ACTOR.login &&
                alert.dismissed_by?.type === STEP_ACTOR.type &&
                reported.has(key) &&
                !accepted.has(key)
              ) {
                await call("PATCH", `/repos/${REPOSITORY}/code-scanning/alerts/${alert.number}`, { state: "open" });
                console.log(`reopened #${alert.number} ${key}: reported again without an accepted suppression`);
                reopened += 1;
              }
            }
            const summary = `Code-scanning reconciliation: ${alerts.length} ${TOOL} alert(s) read, ${accepted.size} finding(s) accepted in source, ${dismissed} dismissed, ${reopened} reopened.`;
            console.log(summary);
            if (process.env.GITHUB_STEP_SUMMARY) fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `\n${summary}\n`);
          };
          main().catch((error) => {
            console.log(`::error title=adaptix/semgrep-security::${error.message}`);
            process.exitCode = 1;
          });
