          python -m venv "${venv}"
          "${venv}/bin/python" -m pip install --disable-pip-version-check --no-input --no-deps --only-binary=:all: --require-hashes -r "${lock}"
          "${venv}/bin/python" -m pip check
          installed="$("${venv}/bin/semgrep" --version)"
          if [ "${installed}" != "${SEMGREP_VERSION}" ]; then
            echo "::error title=adaptix/semgrep-security::the installed Semgrep reports ${installed}, not the pinned ${SEMGREP_VERSION}."
            exit 1
          fi
          echo "${venv}/bin" >> "${GITHUB_PATH}"
          echo "Semgrep ${installed} installed from $(wc -l < "${lock}") hash-locked distributions."

      - name: Write the pinned Adaptix ruleset and its self-test fixtures
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/semgrep"
          mkdir -p "${root}/fixtures/positive" "${root}/fixtures/negative/tests" "${root}/out"

          # The pinned ruleset. Its sha256 is printed below and archived with the results.
          cat > "${root}/adaptix-python.yml" <<'ADAPTIX_SEMGREP_RULES'
          rules:
            # ======================================================================
            # Request data reaching a dangerous sink (intraprocedural taint).
            # Sources: the parameters of an HTTP route handler (FastAPI / Starlette /
            # Flask decorators), minus parameters the framework has already coerced to
            # a non-injectable type and minus dependency-injected parameters, plus the
            # raw request accessors.
            # ======================================================================
            - id: adaptix.python.sqli.request-data-in-sql
              languages: [python]
              severity: ERROR
              message: >-
                Request data is formatted into SQL text that is then executed. Pass the
                value as a bound parameter (text("... :name"), {"name": value}) instead.
              metadata:
                category: security
                subcategory: sql-injection
                cwe: "CWE-89: Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection')"
                owasp: "A03:2021 - Injection"
                confidence: MEDIUM
              mode: taint
              # Taint follows data, not helpers. It flows natively through attribute
              # and item access, string building and calls -- except a call to a helper
              # that is neither a data accessor, nor a string, URL or path builder, nor
              # a callee these rules name as a sink (the two helper sanitizers below):
              # such a helper may validate, rebuild or replace what it is given, so its
              # result is not the request. Nor is a value looked up BY a request key in
              # a server-side table (taint_assume_safe_indexes). Native propagation
              # rather than custom propagators: on a 9,275-line route module it measured
              # about three times faster, and it never taints a receiver by side effect.
              options: &taint_options
                taint_assume_safe_indexes: true
              pattern-sources: &request_sources
                # A typed handler parameter, unless its type already rules injection out
                # (numbers, UUIDs, dates, Literal choices) or it is a framework object or
                # a dependency (Depends / Security), which the server computes.
                - &typed_handler_parameters
                  patterns:
                    - pattern-either:
                        - pattern-inside: |
                            @$ROUTER.$VERB(...)
                            def $HANDLER(..., $PARAM: $TYPE, ...):
                              ...
                        - pattern-inside: |
                            @$ROUTER.$VERB(...)
                            async def $HANDLER(..., $PARAM: $TYPE, ...):
                              ...
                    - metavariable-regex:
                        metavariable: $VERB
                        regex: ^(get|post|put|patch|delete|head|options|api_route|route|websocket)$
                    - metavariable-regex:
                        metavariable: $TYPE
                        regex: ^(?!(Optional\[|Annotated\[|Literal\[)|.*(Depends|Security)\(|\s*(int|float|bool|UUID|uuid\.UUID|datetime|date|time|timedelta|Decimal|Request|WebSocket|Response|BackgroundTasks|AsyncSession|Session|HTTPConnection|SecurityScopes)\s*(\||$)).*
                    - pattern-not-inside: |
                        def $HANDLER(..., $PARAM: $TYPE = Depends(...), ...):
                          ...
                    - pattern-not-inside: |
                        async def $HANDLER(..., $PARAM: $TYPE = Depends(...), ...):
                          ...
                    - pattern-not-inside: |
                        def $HANDLER(..., $PARAM: $TYPE = Security(...), ...):
                          ...
                    - pattern-not-inside: |
                        async def $HANDLER(..., $PARAM: $TYPE = Security(...), ...):
                          ...
                    - pattern: $PARAM
                # Optional[...] / Annotated[...] wrappers: tainted unless they wrap a safe
                # type or carry a dependency.
                - &wrapped_handler_parameters
                  patterns:
                    - pattern-either:
                        - pattern-inside: |
                            @$ROUTER.$VERB(...)
                            def $HANDLER(..., $PARAM: $TYPE, ...):
                              ...
                        - pattern-inside: |
                            @$ROUTER.$VERB(...)
                            async def $HANDLER(..., $PARAM: $TYPE, ...):
                              ...
                    - metavariable-regex:
                        metavariable: $VERB
                        regex: ^(get|post|put|patch|delete|head|options|api_route|route|websocket)$
                    - metavariable-regex:
                        metavariable: $TYPE
                        regex: ^(Optional|Annotated)\[(?!\s*(int|float|bool|UUID|uuid\.UUID|datetime|date|time|timedelta|Decimal|Literal\[)\s*[\],|])(?!.*(Depends|Security)\().*
                    - pattern-not-inside: |
                        def $HANDLER(..., $PARAM: $TYPE = Depends(...), ...):
                          ...
                    - pattern-not-inside: |
                        async def $HANDLER(..., $PARAM: $TYPE = Depends(...), ...):
                          ...
                    - pattern: $PARAM
                # An untyped handler parameter (FastAPI reads it as a query string),
                # unless it is a dependency.
                - &untyped_handler_parameters
                  patterns:
                    - pattern-either:
                        - pattern-inside: |
                            @$ROUTER.$VERB(...)
                            def $HANDLER(..., $PARAM, ...):
                              ...
                        - pattern-inside: |
                            @$ROUTER.$VERB(...)
                            async def $HANDLER(..., $PARAM, ...):
                              ...
                    - metavariable-regex:
                        metavariable: $VERB
                        regex: ^(get|post|put|patch|delete|head|options|api_route|route|websocket)$
                    - pattern-not-inside: |
                        def $HANDLER(..., $PARAM: $ANY, ...):
                          ...
                    - pattern-not-inside: |
                        async def $HANDLER(..., $PARAM: $ANY, ...):
                          ...
                    - pattern-not-inside: |
                        def $HANDLER(..., $PARAM = Depends(...), ...):
                          ...
                    - pattern-not-inside: |
                        async def $HANDLER(..., $PARAM = Depends(...), ...):
                          ...
                    - pattern-not-inside: |
                        def $HANDLER(..., $PARAM = Security(...), ...):
                          ...
                    - pattern-not-inside: |
                        async def $HANDLER(..., $PARAM = Security(...), ...):
                          ...
                    - pattern-not-inside: |
                        def $HANDLER(self, ...):
                          ...
                    - pattern: $PARAM
                # The raw request accessors (Starlette / FastAPI Request, Flask request).
                - &raw_request_accessors
                  patterns:
                    - pattern-either:
                        - pattern: $REQUEST.query_params
                        - pattern: $REQUEST.path_params
                        - pattern: $REQUEST.headers
                        - pattern: $REQUEST.cookies
                        - pattern: $REQUEST.url
                        - pattern: await $REQUEST.json()
                        - pattern: await $REQUEST.form()
                        - pattern: await $REQUEST.body()
                    - metavariable-regex:
                        metavariable: $REQUEST
                        regex: ^(request|req|websocket|http_request)$
                - &flask_request
                  pattern-either:
                    - pattern: flask.request.args
                    - pattern: flask.request.form
                    - pattern: flask.request.values
                    - pattern: flask.request.json
                    - pattern: flask.request.get_json(...)
                    - pattern: flask.request.headers
                    - pattern: flask.request.cookies
                    - pattern: flask.request.files
                    - pattern: flask.request.data
              pattern-sanitizers: &data_sanitizers
                - &type_coercions
                  pattern-either:
                    - pattern: int(...)
                    - pattern: float(...)
                    - pattern: bool(...)
                    - pattern: uuid.UUID(...)
                    - pattern: len(...)
                - &helper_function_calls
                  patterns:
                    - pattern: $FUNC(...)
                    - pattern-not: $OBJ.$METHOD(...)
                    - metavariable-regex:
                        metavariable: $FUNC
                        regex: ^(?!(str|bytes|repr|format|dict|list|tuple|set|frozenset|sorted|reversed|Path|PurePath|PurePosixPath|urljoin|unquote|unquote_plus|quote|quote_plus|urlparse|urlsplit|urlunparse|urlunsplit|text|open|FileResponse|send_file|urlopen|Request|system|popen|getoutput|getstatusoutput|create_subprocess_shell|run|call|check_call|check_output|Popen)$)(?!(?i:_*(is_|ensure_|validate_|verify_|check_|assert_|require_)[a-z0-9_]*(trusted|allowed|allowlist|allowlisted|permitted|safe)[a-z0-9_]*$)).*
                - &helper_method_calls
                  patterns:
                    - pattern: $OBJ.$METHOD(...)
                    - metavariable-regex:
                        metavariable: $METHOD
                        regex: ^(?!(get|getlist|pop|setdefault|items|values|keys|copy|strip|lstrip|rstrip|lower|upper|casefold|title|replace|format|format_map|split|rsplit|splitlines|partition|rpartition|removeprefix|removesuffix|encode|decode|join|expandtabs|zfill|ljust|rjust|center|translate|json|dict|model_dump|to_dict|urljoin|unquote|unquote_plus|quote|quote_plus|Path|PurePath|PurePosixPath|normpath|abspath|realpath|expanduser|loads|b64decode|urlsafe_b64decode|parse_qs|parse_qsl|urlparse|urlsplit|urlunparse|urlunsplit|geturl|execute|executemany|executescript|exec_driver_sql|fetch|fetchrow|fetchval|raw|text|system|popen|create_subprocess_shell|run|call|check_call|check_output|Popen|getoutput|getstatusoutput|post|put|patch|delete|head|options|request|stream|urlopen|Request|open|read_text|read_bytes|write_text|write_bytes|unlink|remove|rmdir|rmtree|copyfile|move|FileResponse|send_file)$)(?!(?i:_*(is_|ensure_|validate_|verify_|check_|assert_|require_)[a-z0-9_]*(trusted|allowed|allowlist|allowlisted|permitted|safe)[a-z0-9_]*$)).*
                # A value looked up BY a request key in a constant server-side table is
                # not request data: TABLE.get(key) as much as TABLE[key].
                - &constant_table_lookups
                  patterns:
                    - pattern: $TABLE.get(...)
                    - metavariable-regex:
                        metavariable: $TABLE
                        regex: ^_?[A-Z][A-Z0-9_]*$
                # An explicit allow-list or trust check on a value (is_trusted_host(url),
                # ensure_allowed_path(p), ...) vouches for it from that point on. The
                # helper sanitizers above exclude such check calls by name, because a
                # sanitizer on the enclosing call would override this one. A handler
                # PARAMETER is request data at every use, so a check on the parameter
                # itself is not seen: check a local copy, or suppress the finding by
                # rule id with the reason.
                - &allow_list_checks
                  by-side-effect: true
                  patterns:
                    - pattern: $CHECK($VALUE, ...)
                    - metavariable-regex:
                        metavariable: $CHECK
                        regex: (?i)^([A-Za-z_][A-Za-z0-9_]*\.)*_*(is_|ensure_|validate_|verify_|check_|assert_|require_)[a-z0-9_]*(trusted|allowed|allowlist|allowlisted|permitted|safe)[a-z0-9_]*$
                    - focus-metavariable: $VALUE
              pattern-sinks:
                # SQL text. sqlalchemy.text() and exec_driver_sql() only ever take SQL, so
                # any tainted argument is the finding. execute()/fetch*() also take ORM
                # statements, which bind their values, so there only a string being built
                # in the call itself is SQL text.
                - patterns:
                    - pattern-either:
                        - pattern: sqlalchemy.text($SQL, ...)
                        - pattern: sqlalchemy.sql.text($SQL, ...)
                        - pattern: $DB.exec_driver_sql($SQL, ...)
                    - focus-metavariable: $SQL
                - patterns:
                    - pattern-either:
                        - pattern: $DB.execute($SQL, ...)
                        - pattern: $DB.executemany($SQL, ...)
                        - pattern: $DB.executescript($SQL, ...)
                        - pattern: $DB.fetch($SQL, ...)
                        - pattern: $DB.fetchrow($SQL, ...)
                        - pattern: $DB.fetchval($SQL, ...)
                        - pattern: $DB.raw($SQL, ...)
                    - metavariable-regex:
                        metavariable: $SQL
                        regex: (?s)^\s*([rRbB]?[fF][rR]?["']|[rRbB]?["'].*["']\s*(%|\.format\(|\+)|.*\+\s*[rRbB]?[fF]?[rR]?["'])
                    - focus-metavariable: $SQL

            - id: adaptix.python.injection.request-data-in-shell-command
              languages: [python]
              severity: ERROR
              message: >-
                Request data reaches a command that a shell interprets. Pass an argument
                list to subprocess without shell=True, and never let request data choose
                the executable.
              metadata:
                category: security
                subcategory: command-injection
                cwe: "CWE-78: Improper Neutralization of Special Elements used in an OS Command ('OS Command Injection')"
                owasp: "A03:2021 - Injection"
                confidence: MEDIUM
              mode: taint
              options: *taint_options
              pattern-sources: *request_sources
              pattern-sanitizers:
                - *type_coercions
                - *helper_function_calls
                - *helper_method_calls
                - *constant_table_lookups
                - *allow_list_checks
                - pattern: shlex.quote(...)
              pattern-sinks:
                - patterns:
                    - pattern-either:
                        - pattern: subprocess.$FN($CMD, ..., shell=True, ...)
                        - pattern: os.system($CMD)
                        - pattern: os.popen($CMD, ...)
                        - pattern: asyncio.create_subprocess_shell($CMD, ...)
                        - pattern: subprocess.getoutput($CMD)
                        - pattern: subprocess.getstatusoutput($CMD)
                    - focus-metavariable: $CMD

            - id: adaptix.python.ssrf.request-data-controls-url
              languages: [python]
              severity: ERROR
              message: >-
                Request data is the whole URL of an outbound HTTP request (server-side
                request forgery). Resolve the destination from configuration or an
                allow-list, never from the request.
              metadata:
                category: security
                subcategory: ssrf
                cwe: "CWE-918: Server-Side Request Forgery (SSRF)"
                owasp: "A10:2021 - Server-Side Request Forgery (SSRF)"
                confidence: MEDIUM
              mode: taint
              options: *taint_options
              pattern-sources: *request_sources
              pattern-sanitizers:
                - *type_coercions
                - *helper_function_calls
                - *helper_method_calls
                - *constant_table_lookups
                - *allow_list_checks
                # A URL built by formatting or concatenation takes its scheme and host
                # from its leading component, which the next rule judges. Here only
                # request data that IS the URL is reported.
                - pattern: f"..."
                - pattern: $LEFT + $RIGHT
                - pattern: '"...".format(...)'
                - pattern: '"..." % $ARGS'
              pattern-sinks:
                - patterns:
                    - pattern-either: &outbound_http_calls
                        - patterns:
                            - pattern-either:
                                - pattern: requests.$FN($URL, ...)
                                - pattern: httpx.$FN($URL, ...)
                                - pattern: requests.$FN(..., url=$URL, ...)
                                - pattern: httpx.$FN(..., url=$URL, ...)
                            - metavariable-regex:
                                metavariable: $FN
                                regex: ^(get|post|put|patch|delete|head|options)$
                        - pattern: requests.request($METHOD, $URL, ...)
                        - pattern: httpx.request($METHOD, $URL, ...)
                        - pattern: httpx.stream($METHOD, $URL, ...)
                        - pattern: urllib.request.urlopen($URL, ...)
                        - pattern: urllib.request.Request($URL, ...)
                        - patterns:
                            - pattern-either:
                                - pattern-inside: |
                                    async with httpx.AsyncClient(...) as $CLIENT:
                                      ...
                                - pattern-inside: |
                                    with httpx.Client(...) as $CLIENT:
                                      ...
                                - pattern-inside: |
                                    async with aiohttp.ClientSession(...) as $CLIENT:
                                      ...
                                - pattern-inside: |
                                    with requests.Session() as $CLIENT:
                                      ...
                            - pattern-either:
                                - patterns:
                                    - pattern-either:
                                        - pattern: $CLIENT.$FN($URL, ...)
                                        - pattern: $CLIENT.$FN(..., url=$URL, ...)
                                    - metavariable-regex:
                                        metavariable: $FN
                                        regex: ^(get|post|put|patch|delete|head|options)$
                                - pattern: $CLIENT.request($METHOD, $URL, ...)
                                - pattern: $CLIENT.stream($METHOD, $URL, ...)
                    - focus-metavariable: $URL

            - id: adaptix.python.ssrf.request-data-leads-built-url
              languages: [python]
              severity: ERROR
              message: >-
                Request data is the leading component of an outbound URL built by
                formatting or concatenation, so it decides the scheme and host
                (server-side request forgery). Start the URL from a configured base; the
                request may only choose a path after it.
              metadata:
                category: security
                subcategory: ssrf
                cwe: "CWE-918: Server-Side Request Forgery (SSRF)"
                owasp: "A10:2021 - Server-Side Request Forgery (SSRF)"
                confidence: MEDIUM
              mode: taint
              options: *taint_options
              # Taint labels: request data carries the default label; request data that
              # stands at the head of a built URL -- f"{value}...", f"https://{value}...",
              # value + "..." -- also gains HOST, which flows with the built string into
              # a variable and on into the call. Only HOST reaches the sink, so a request
              # value after a fixed base is never this finding.
              pattern-sources:
                - *typed_handler_parameters
                - *wrapped_handler_parameters
                - *untyped_handler_parameters
                - *raw_request_accessors
                - *flask_request
                - label: HOST
                  requires: __SOURCE__
                  patterns:
                    - pattern-either:
                        - pattern: f"{$HEAD}..."
                        - pattern: f"http://{$HEAD}..."
                        - pattern: f"https://{$HEAD}..."
                        - pattern: $HEAD + $TAIL
                    - focus-metavariable: $HEAD
              pattern-sanitizers: *data_sanitizers
              pattern-sinks:
                - requires: HOST
                  patterns:
                    - pattern-either: *outbound_http_calls
                    - focus-metavariable: $URL

            - id: adaptix.python.path-traversal.request-data-in-file-path
              languages: [python]
              severity: ERROR
              message: >-
                Request data becomes part of a filesystem path that is opened, served,
                written or deleted. Reduce it to a bare file name (os.path.basename or
                werkzeug.utils.secure_filename) or map it to a server-chosen path.
              metadata:
                category: security
                subcategory: path-traversal
                cwe: "CWE-22: Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal')"
                owasp: "A01:2021 - Broken Access Control"
                confidence: MEDIUM
              mode: taint
              options: *taint_options
              pattern-sources: *request_sources
              pattern-sanitizers:
                - *type_coercions
                - *helper_function_calls
                - *helper_method_calls
                - *constant_table_lookups
                - *allow_list_checks
                - pattern: os.path.basename(...)
                - pattern: werkzeug.utils.secure_filename(...)
                - pattern: pathlib.Path(...).name
              pattern-sinks:
                - patterns:
                    - pattern-either:
                        - pattern: open($PATH, ...)
                        - pattern: io.open($PATH, ...)
                        - pattern: aiofiles.open($PATH, ...)
                        - pattern: os.remove($PATH, ...)
                        - pattern: os.unlink($PATH, ...)
                        - pattern: os.rmdir($PATH, ...)
                        - pattern: shutil.rmtree($PATH, ...)
                        - pattern: shutil.copy($PATH, ...)
                        - pattern: shutil.copyfile($PATH, ...)
                        - pattern: shutil.move($PATH, ...)
                        - pattern: pathlib.Path($PATH, ...).open(...)
                        - pattern: pathlib.Path($PATH, ...).read_text(...)
                        - pattern: pathlib.Path($PATH, ...).read_bytes(...)
                        - pattern: pathlib.Path($PATH, ...).write_text(...)
                        - pattern: pathlib.Path($PATH, ...).write_bytes(...)
                        - pattern: pathlib.Path($PATH, ...).unlink(...)
                        - pattern: fastapi.responses.FileResponse($PATH, ...)
                        - pattern: starlette.responses.FileResponse($PATH, ...)
                        - pattern: flask.send_file($PATH, ...)
                    - focus-metavariable: $PATH

            # ======================================================================
            # Dangerous APIs, judged on their own.
            # ======================================================================
            - id: adaptix.python.injection.shell-command-built-from-data
              languages: [python]
              severity: ERROR
              message: >-
                A shell interprets a command string that is not a literal. Pass an argument
                list to subprocess without shell=True (or shlex.quote every value).
              metadata:
                category: security
                subcategory: command-injection
                cwe: "CWE-78: Improper Neutralization of Special Elements used in an OS Command ('OS Command Injection')"
                owasp: "A03:2021 - Injection"
                confidence: HIGH
              patterns:
                - pattern-either:
                    - pattern: subprocess.$FN($CMD, ..., shell=True, ...)
                    - pattern: os.system($CMD)
                    - pattern: os.popen($CMD, ...)
                    - pattern: asyncio.create_subprocess_shell($CMD, ...)
                    - pattern: subprocess.getoutput($CMD)
                    - pattern: subprocess.getstatusoutput($CMD)
                - metavariable-pattern:
                    metavariable: $CMD
                    patterns:
                      - pattern-not: '"..."'

            - id: adaptix.python.injection.code-evaluated-from-data
              languages: [python]
              severity: ERROR
              message: >-
                eval/exec runs a string that is not a literal. Parse the data
                (json.loads, ast.literal_eval) instead of executing it.
              metadata:
                category: security
                subcategory: code-injection
                cwe: "CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code ('Eval Injection')"
                owasp: "A03:2021 - Injection"
                confidence: HIGH
              paths:
                exclude: &test_paths
                  - "tests/"
                  - "test/"
                  - "test_*.py"
                  - "*_test.py"
                  - "conftest.py"
              patterns:
                - pattern-either:
                    - pattern: eval($CODE, ...)
                    - pattern: exec($CODE, ...)
                - metavariable-pattern:
                    metavariable: $CODE
                    patterns:
                      - pattern-not: '"..."'

            - id: adaptix.python.deserialization.pickle-family
              languages: [python]
              severity: ERROR
              message: >-
                pickle-family deserialisation executes code chosen by whoever wrote the
                bytes. Use JSON (or another data-only format) for anything that crosses a
                trust boundary.
              metadata:
                category: security
                subcategory: insecure-deserialization
                cwe: "CWE-502: Deserialization of Untrusted Data"
                owasp: "A08:2021 - Software and Data Integrity Failures"
                confidence: HIGH
              patterns:
                - pattern-either:
                    - pattern: pickle.loads(...)
                    - pattern: pickle.load(...)
                    - pattern: pickle.Unpickler(...)
                    - pattern: _pickle.loads(...)
                    - pattern: cPickle.loads(...)
                    - pattern: cPickle.load(...)
                    - pattern: dill.loads(...)
                    - pattern: dill.load(...)
                    - pattern: marshal.loads(...)
                    - pattern: marshal.load(...)
                    - pattern: jsonpickle.decode(...)
                    - pattern: shelve.open(...)
                    - pattern: pandas.read_pickle(...)
                - pattern-not: pickle.loads(pickle.dumps(...))

            - id: adaptix.python.deserialization.unsafe-yaml-load
              languages: [python]
              severity: ERROR
              message: >-
                This YAML loader can construct arbitrary Python objects. Use
                yaml.safe_load (or Loader=yaml.SafeLoader).
              metadata:
                category: security
                subcategory: insecure-deserialization
                cwe: "CWE-502: Deserialization of Untrusted Data"
                owasp: "A08:2021 - Software and Data Integrity Failures"
                confidence: HIGH
              pattern-either:
                - pattern: yaml.unsafe_load(...)
                - pattern: yaml.unsafe_load_all(...)
                - pattern: yaml.full_load(...)
                - pattern: yaml.full_load_all(...)
                - patterns:
                    - pattern-either:
                        - pattern: yaml.load(..., Loader=$LOADER, ...)
                        - pattern: yaml.load_all(..., Loader=$LOADER, ...)
                    - metavariable-regex:
                        metavariable: $LOADER
                        regex: ^(yaml\.)?(Loader|UnsafeLoader|FullLoader|CLoader|CUnsafeLoader|CFullLoader)$

            - id: adaptix.python.crypto.broken-cipher-or-mode
              languages: [python]
              severity: ERROR
              message: >-
                A broken cipher or ECB mode is in use. Use AES-GCM or ChaCha20-Poly1305
                (cryptography.hazmat.primitives.ciphers.aead).
              metadata:
                category: security
                subcategory: weak-crypto
                cwe: "CWE-327: Use of a Broken or Risky Cryptographic Algorithm"
                owasp: "A02:2021 - Cryptographic Failures"
                confidence: HIGH
              pattern-either:
                - pattern: cryptography.hazmat.primitives.ciphers.algorithms.TripleDES(...)
                - pattern: cryptography.hazmat.primitives.ciphers.algorithms.ARC4(...)
                - pattern: cryptography.hazmat.primitives.ciphers.algorithms.Blowfish(...)
                - pattern: cryptography.hazmat.primitives.ciphers.algorithms.CAST5(...)
                - pattern: cryptography.hazmat.primitives.ciphers.algorithms.IDEA(...)
                - pattern: cryptography.hazmat.primitives.ciphers.algorithms.SEED(...)
                - pattern: cryptography.hazmat.decrepit.ciphers.algorithms.$ALG(...)
                - pattern: cryptography.hazmat.primitives.ciphers.modes.ECB(...)
                - pattern: Crypto.Cipher.DES.new(...)
                - pattern: Crypto.Cipher.DES3.new(...)
                - pattern: Crypto.Cipher.ARC2.new(...)
                - pattern: Crypto.Cipher.ARC4.new(...)
                - pattern: Crypto.Cipher.Blowfish.new(...)
                - pattern: Crypto.Cipher.CAST.new(...)
                - pattern: Crypto.Cipher.$ANY.new($KEY, Crypto.Cipher.$MOD.MODE_ECB, ...)
                - pattern: Cryptodome.Cipher.DES.new(...)
                - pattern: Cryptodome.Cipher.DES3.new(...)
                - pattern: Cryptodome.Cipher.ARC4.new(...)
                - pattern: Cryptodome.Cipher.Blowfish.new(...)
                - pattern: Cryptodome.Cipher.$ANY.new($KEY, Cryptodome.Cipher.$MOD.MODE_ECB, ...)

            - id: adaptix.python.crypto.short-asymmetric-key
              languages: [python]
              severity: ERROR
              message: >-
                An RSA or DSA key shorter than 2048 bits can be factored or forged. Use at
                least 2048 bits (3072 for keys that must outlive 2030).
              metadata:
                category: security
                subcategory: weak-crypto
                cwe: "CWE-326: Inadequate Encryption Strength"
                owasp: "A02:2021 - Cryptographic Failures"
                confidence: HIGH
              patterns:
                - pattern-either:
                    - pattern: cryptography.hazmat.primitives.asymmetric.rsa.generate_private_key(..., key_size=$SIZE, ...)
                    - pattern: cryptography.hazmat.primitives.asymmetric.dsa.generate_private_key(key_size=$SIZE, ...)
                    - pattern: cryptography.hazmat.primitives.asymmetric.dsa.generate_private_key($SIZE, ...)
                    - pattern: Crypto.PublicKey.RSA.generate($SIZE, ...)
                    - pattern: Cryptodome.PublicKey.RSA.generate($SIZE, ...)
                - metavariable-comparison:
                    metavariable: $SIZE
                    comparison: $SIZE < 2048

            - id: adaptix.python.crypto.tls-verification-disabled
              languages: [python]
              severity: ERROR
              message: >-
                TLS certificate or hostname verification is switched off, so any
                man-in-the-middle is trusted. Keep verification on; pin a CA bundle with
                verify="/path/ca.pem" when a private CA is needed.
              metadata:
                category: security
                subcategory: weak-crypto
                cwe: "CWE-295: Improper Certificate Validation"
                owasp: "A07:2021 - Identification and Authentication Failures"
                confidence: HIGH
              pattern-either:
                - pattern: requests.$FN(..., verify=False, ...)
                - pattern: requests.Session(...).$FN(..., verify=False, ...)
                - pattern: httpx.$FN(..., verify=False, ...)
                - pattern: aiohttp.TCPConnector(..., ssl=False, ...)
                - pattern: aiohttp.TCPConnector(..., verify_ssl=False, ...)
                - patterns:
                    - pattern-either:
                        - pattern-inside: |
                            async with aiohttp.ClientSession(...) as $SESSION:
                              ...
                        - pattern-inside: |
                            $SESSION = aiohttp.ClientSession(...)
                            ...
                    - pattern: $SESSION.$FN(..., ssl=False, ...)
                - pattern: ssl._create_unverified_context(...)
                - pattern: ssl._create_default_https_context = ssl._create_unverified_context

            - id: adaptix.python.crypto.insecure-random-for-secret
              languages: [python]
              severity: ERROR
              message: >-
                The random module is predictable and must not produce tokens, passwords,
                one-time codes, salts or nonces. Use the secrets module.
              metadata:
                category: security
                subcategory: weak-crypto
                cwe: "CWE-338: Use of Cryptographically Weak Pseudo-Random Number Generator (PRNG)"
                owasp: "A02:2021 - Cryptographic Failures"
                confidence: HIGH
              patterns:
                - pattern-either:
                    - pattern: $VAR = <... random.$FN(...) ...>
                    - pattern: $OBJ.$VAR = <... random.$FN(...) ...>
                - metavariable-regex:
                    metavariable: $FN
                    regex: ^(random|randint|randrange|choice|choices|sample|getrandbits|shuffle|uniform|randbytes)$
                - metavariable-regex:
                    metavariable: $VAR
                    regex: (?i)^_*(token|secret|password|passwd|passcode|otp|one_time_code|nonce|salt|api_key|apikey|session_key|session_id|csrf|reset_code|verification_code)(_[a-z0-9]+)?$

            - id: adaptix.python.jwt.signature-not-verified
              languages: [python]
              severity: ERROR
              message: >-
                A JWT is decoded without verifying its signature, so every claim in it is
                attacker-chosen. Verify with the issuer's key and an explicit algorithms
                list; to read the key id before verifying, use jwt.get_unverified_header.
              metadata:
                category: security
                subcategory: jwt
                cwe: "CWE-347: Improper Verification of Cryptographic Signature"
                owasp: "A02:2021 - Cryptographic Failures"
                confidence: HIGH
              paths:
                exclude: *test_paths
              pattern-either:
                - pattern: 'jwt.decode(..., options={..., "verify_signature": False, ...}, ...)'
                - pattern: jwt.decode(..., verify=False, ...)
                - pattern: jose.jwt.get_unverified_claims(...)
                - pattern: jwt.get_unverified_claims(...)
                - pattern: 'jose.jwt.decode(..., options={..., "verify_signature": False, ...}, ...)'
                - pattern: 'authlib.jose.jwt.decode(..., options={..., "verify_signature": False, ...}, ...)'

            - id: adaptix.python.jwt.none-algorithm
              languages: [python]
              severity: ERROR
              message: >-
                The "none" JWT algorithm means "no signature". Never accept or issue it.
              metadata:
                category: security
                subcategory: jwt
                cwe: "CWE-327: Use of a Broken or Risky Cryptographic Algorithm"
                owasp: "A02:2021 - Cryptographic Failures"
                confidence: HIGH
              paths:
                exclude: *test_paths
              patterns:
                - pattern-either:
                    - pattern: jwt.decode(..., algorithms=[..., $ALG, ...], ...)
                    - pattern: jwt.encode(..., algorithm=$ALG, ...)
                    - pattern: jose.jwt.decode(..., algorithms=[..., $ALG, ...], ...)
                    - pattern: jose.jwt.encode(..., algorithm=$ALG, ...)
                - metavariable-regex:
                    metavariable: $ALG
                    regex: (?i)^["']none["']$

            - id: adaptix.python.jwt.hardcoded-signing-key
              languages: [python]
              severity: ERROR
              message: >-
                A JWT is signed or verified with a key written into the source. Load the
                key from the secret store at run time.
              metadata:
                category: security
                subcategory: jwt
                cwe: "CWE-798: Use of Hard-coded Credentials"
                owasp: "A07:2021 - Identification and Authentication Failures"
                confidence: HIGH
              paths:
                exclude: *test_paths
              pattern-either:
                - pattern: jwt.encode($CLAIMS, "...", ...)
                - pattern: jwt.decode($TOKEN, "...", ...)
                - pattern: jwt.encode($CLAIMS, key="...", ...)
                - pattern: jwt.decode($TOKEN, key="...", ...)
                - pattern: jose.jwt.encode($CLAIMS, "...", ...)
                - pattern: jose.jwt.decode($TOKEN, "...", ...)

            - id: adaptix.python.logging.secret-or-pii-logged
              languages: [python]
              severity: ERROR
              message: >-
                A credential or a direct personal identifier is written to a log (or to
                standard output, which the platform ships to the same log store). Log a
                redacted form or an opaque reference instead.
              metadata:
                category: security
                subcategory: sensitive-data-exposure
                cwe: "CWE-532: Insertion of Sensitive Information into Log File"
                owasp: "A09:2021 - Security Logging and Monitoring Failures"
                confidence: MEDIUM
              paths:
                exclude: *test_paths
              patterns:
                - pattern-either:
                    - pattern: $LOG.$LEVEL(..., $VALUE, ...)
                    - pattern: $LOG.$LEVEL(..., $KEY=$VALUE, ...)
                    - pattern: $LOG.$LEVEL(..., f"...{$VALUE}...", ...)
                    - pattern: $LOG.$LEVEL(..., "..." % $VALUE, ...)
                    - pattern: '$LOG.$LEVEL(..., "..." % (..., $VALUE, ...), ...)'
                    - pattern: $LOG.$LEVEL(..., "...".format(..., $VALUE, ...), ...)
                    - pattern: $LOG.$LEVEL(..., "...".format(..., $KEY=$VALUE, ...), ...)
                    - pattern: '$LOG.$LEVEL(..., extra={..., $KEY: $VALUE, ...}, ...)'
                    - pattern: print(..., $VALUE, ...)
                    - pattern: print(..., f"...{$VALUE}...", ...)
                - metavariable-regex:
                    metavariable: $LEVEL
                    regex: ^(debug|info|warning|warn|error|exception|critical|fatal|log|msg)$
                - metavariable-regex:
                    metavariable: $VALUE
                    regex: (?i)^([A-Za-z_][A-Za-z0-9_]*\.)*_*(password|passwd|client_secret|secret_value|api_key|apikey|access_token|refresh_token|id_token|bearer_token|auth_token|session_token|private_key|signing_key|authorization|ssn|social_security_number|date_of_birth)$

            - id: adaptix.python.logging.auth-header-logged
              languages: [python]
              severity: ERROR
              message: >-
                Request headers or cookies are written to a log; they carry bearer tokens
