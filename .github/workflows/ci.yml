# ci.yml — production CI gate (Python/FastAPI services).
# Replaces AWS CodeBuild pr-validation.yml + security-scan.yml.
# v8: Definitive install strategy — always --system, handles setuptools+uv.lock.

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.12.3"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "**/requirements-dev.lock"
      - name: Install ruff
        run: uv pip install --system ruff==0.15.20
      - name: Ruff lint
        run: |
          BD=$(for d in backend core/backend src .; do [ -d "$d" ] && [ -f "$d/pyproject.toml" ] && echo "$d" && break; done)
          cd "${BD:-.}" && ruff check .
      - name: Ruff format check
        run: |
          BD=$(for d in backend core/backend src .; do [ -d "$d" ] && [ -f "$d/pyproject.toml" ] && echo "$d" && break; done)
          cd "${BD:-.}" && ruff format --check .

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "**/requirements-dev.lock"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            backend/.mypy_cache
            .mypy_cache
          key: mypy-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('**/requirements-dev.lock') }}
          restore-keys: mypy-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-
      - name: Install dependencies
        run: |
          BD=$(for d in backend core/backend src .; do [ -d "$d" ] && [ -f "$d/pyproject.toml" ] && echo "$d" && break; done)
          BD="${BD:-.}"
          if [ -f "$BD/requirements-dev.lock" ]; then
            uv pip install --system --quiet -r "$BD/requirements-dev.lock"
            uv pip install --system --quiet --no-deps -e "$BD"
          else
            uv pip install --system --quiet mypy==2.3.0
            uv pip install --system --quiet -e "$BD" || true
          fi
      - name: Mypy
        continue-on-error: true
        run: |
          BD=$(for d in backend core/backend src .; do [ -d "$d" ] && [ -f "$d/pyproject.toml" ] && echo "$d" && break; done)
          cd "${BD:-.}" && mypy --ignore-missing-imports . || echo "WARN: mypy errors (non-blocking)"

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 2
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: test_db
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "**/requirements-dev.lock"
      - name: Install dependencies
        run: |
          BD=$(for d in backend core/backend src .; do [ -d "$d" ] && [ -f "$d/pyproject.toml" ] && echo "$d" && break; done)
          BD="${BD:-.}"
          # Install strategy: always --system so pytest is on PATH.
          # Resolution order:
          #   1. BD-level requirements-dev.lock (most repos: backend/)
          #   2. Root-level requirements-dev.lock (Gateway, Forms: lock at root)
          #   3. BD-level uv.lock -> export then pip install --system
          #   4. Root-level uv.lock -> export then pip install --system
          #   5. Fallback -> minimal install
          LOCKFILE=""
          UVLOCK=""
          [ -f "$BD/requirements-dev.lock" ] && LOCKFILE="$BD/requirements-dev.lock"
          [ -z "$LOCKFILE" ] && [ -f "requirements-dev.lock" ] && LOCKFILE="requirements-dev.lock"
          [ -f "$BD/uv.lock" ] && UVLOCK="$BD/uv.lock"
          [ -z "$UVLOCK" ] && [ -f "uv.lock" ] && UVLOCK="uv.lock"

          if [ -n "$LOCKFILE" ]; then
            echo "CI: installing from $LOCKFILE"
            uv pip install --system --quiet -r "$LOCKFILE"
            uv pip install --system --quiet --no-deps -e "$BD"
          elif [ -n "$UVLOCK" ]; then
            echo "CI: exporting $UVLOCK then installing"
            UVLOCK_DIR=$(dirname "$UVLOCK")
            cd "$UVLOCK_DIR"
            uv export --frozen --extra dev --no-emit-project --no-hashes \
              -o /tmp/ci-requirements.txt 2>/dev/null || \
            uv export --frozen --no-emit-project --no-hashes \
              -o /tmp/ci-requirements.txt
            cd -
            uv pip install --system --quiet -r /tmp/ci-requirements.txt
            uv pip install --system --quiet --no-deps -e "$BD"
          else
            echo "CI: no lock file - minimal install"
            uv pip install --system --quiet \
              pytest pytest-asyncio pytest-cov pytest-xdist aiosqlite httpx fastapi
            uv pip install --system --quiet -e "$BD" || true
          fi
          # Always ensure drivers + test tooling on system Python.
          # Some repos omit pytest-xdist/pytest-cov from dev deps but
          # our -n auto flag requires it fleet-wide.
          uv pip install --system --quiet \
            asyncpg psycopg2-binary \
            pytest-xdist pytest-cov pytest-asyncio httpx aiosqlite || true

      - name: Pytest
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:ci@localhost:5432/test_db
          AI_MIGRATION_TEST_DATABASE_URL: postgresql+asyncpg://postgres:ci@localhost:5432/test_db
          SYNC_DATABASE_URL: postgresql://postgres:ci@localhost:5432/test_db
        run: |
          BD=$(for d in backend core/backend src .; do [ -d "$d/tests" ] && echo "$d" && break; done)
          BD="${BD:-.}"
          # Exclude ALL CodeBuild governance/validation tests.
          # These assert .codebuild/ files exist - intentionally deleted.
          IGNORE=""
          for f in \
            test_ci_download_checksums \
            test_repo_automation_guards \
            test_buildspec \
            test_codebuild \
            test_validation_buildspec \
            test_codebuild_validation_specs; do
            [ -n "$(find "$BD" -name "${f}*.py" -path '*/tests/*' 2>/dev/null)" ] && \
              IGNORE="$IGNORE --ignore-glob=*${f}*"
          done
          # Auto-detect any test file referencing .codebuild
          if [ -d "$BD/tests" ]; then
            while IFS= read -r fp; do
              [ -z "$fp" ] && continue
              fname=$(basename "$fp" .py)
              echo "CI: auto-ignoring CodeBuild test: $fname"
              IGNORE="$IGNORE --ignore-glob=*${fname}*"
            done < <(grep -rl '\.codebuild' "$BD/tests" --include='*.py' 2>/dev/null)
          fi
          cd "$BD"
          python -m pytest -q --no-header --tb=line -n auto $IGNORE

  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        continue-on-error: true
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "**/requirements-dev.lock"
      - name: Bandit (high-severity)
        run: |
          uv pip install --system --quiet bandit
          TARGETS=()
          for d in backend core/backend src; do [ -d "$d" ] && TARGETS+=("$d"); done
          if [ ${#TARGETS[@]} -eq 0 ]; then echo "WARN: no python dirs; skipped"
          else bandit -r "${TARGETS[@]}" -lll -iii --exclude '**/tests/**,**/test_*.py,**/migrations/**'; fi
      - name: Safety (known CVEs)
        continue-on-error: true
        run: |
          uv pip install --system --quiet safety
          BD=$(for d in backend core/backend src .; do [ -d "$d" ] && [ -f "$d/requirements-dev.lock" ] && echo "$d" && break; done)
          if [ -n "$BD" ]; then
            safety check -r "$BD/requirements-dev.lock" --ignore 70612 || true
          else
            echo "WARN: no requirements-dev.lock; safety check skipped"
          fi
