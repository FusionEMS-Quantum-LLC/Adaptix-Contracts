name: Codacy Coverage
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  coverage:
    runs-on: ubuntu-latest
    # Mapped to `env` so the step-level `if:` below can read it: the `secrets`
    # context is NOT available in a step-level `if:`, so `if: secrets.X != ''`
    # would evaluate false on EVERY run and skip the upload on main too.
    env:
      CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-cov pytest-xdist aiosqlite httpx
          pip install -e . || true
          pip install -e ".[test]" || true
          pip install -e ".[dev]" || true
          for f in $(find . -maxdepth 3 -name "requirements*.txt" -not -path "*/node_modules/*" -not -path "*/.git/*"); do pip install -r "$f" || true; done
      - name: Run tests with coverage
        working-directory: .
        continue-on-error: true
        run: python -m pytest --cov=adaptix_contracts --cov-report=xml:coverage.xml -q
      - name: Normalize coverage paths
        working-directory: .
        run: |
          if [ -f coverage.xml ]; then echo root-relative; else echo "no coverage.xml"; exit 1; fi
      - name: Upload coverage to Codacy
        if: env.CODACY_PROJECT_TOKEN != ''
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699 # v1.3.0
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: coverage.xml

      # Never skip silently: a repo whose token was revoked must not look
      # identical to a healthy one.
      - name: Report skipped coverage upload
        if: env.CODACY_PROJECT_TOKEN == ''
        run: |
          echo "Codacy upload SKIPPED: CODACY_PROJECT_TOKEN is not available to this run."
          echo "Expected for Dependabot and fork pull requests, which cannot read repository Actions secrets."
          echo "Tests ran and the coverage report was produced; coverage uploads on the post-merge push run."
