name: repo-validation

# THE ONLY VALIDATION WORKFLOW A REPOSITORY MAY CARRY.
#
# This file is generated from validation/carrier-workflow.yml in
# FusionEMS-Quantum-LLC/adaptix-ops and is identical in every repository. It
# holds no validation logic, no runtime version, no policy, and no repository
# specifics. Everything that decides what must run, whether a phase was
# skipped, and whether the result is green lives in the engine it calls.
#
# What it replaces, per repository:
#   .github/workflows/pr-validation.yml   (copied, with a hardcoded runtime)
#   scripts/ci/verify-toolchain.sh        (copied)
#   scripts/verify_toolchain.py           (copied)
#   scripts/generate_tool_inventory.py    (copied)
#   governance/approved-tools.json        (copied, and drifted into 3 versions)
#
# Those files are removed in a SEPARATE correction, per repository, once the
# engine is proven to subsume them for that repository. Adoption of this carrier
# is additive: several repositories carry gates that exist only in the legacy
# workflow (real-PostgreSQL RLS lanes, merged-with-base migration graph checks,
# ratcheted frontend scans), and deleting a real gate before proving equivalence
# would be a regression dressed as cleanup. The end state is still exactly one
# validation carrier per repository.
#
# The push trigger is deliberate. With `pull_request` alone, main was never
# validated: a defect could land, sit red on main unnoticed, and surface on the
# next unrelated pull request, which inherited the blame. Measured case —
# Adaptix-EPCR-Service PR #438 failed on a broken Alembic migration chain that
# landed on main on 2026-08-19 and had nothing to do with that PR's change.

on:
  pull_request:
  push:
    branches: [main]
  # Deliberately no workflow_dispatch. A manual run reports under a different
  # github.ref than the pull_request run, so the two land in separate
  # concurrency groups and can interleave -- and the later finisher wins a
  # REQUIRED check. Re-running a transient failure is already possible from the
  # run's own "Re-run jobs", which reports against the same SHA.

concurrency:
  # Keyed by workflow name as well as ref, so this carrier never shares a
  # cancellation group with another workflow on the same branch.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The job name IS the required status check name. Branch protection requires
  # the literal string `adaptix/repo-validation` in every enforced repository,
  # so this name is a contract: renaming the job silently detaches the gate,
  # and a required check whose name never appears blocks every pull request
  # forever as "Expected". Do not rename it.
  repo-validation:
    name: adaptix/repo-validation
    runs-on: ubuntu-latest
    # A hung engine phase must not hold a runner for GitHub's 6-hour default.
    # 60 is set from measured FULL RUNS, not the longest single phase: under
    # engine 1.10.0 on 2026-09-03, Adaptix-Core-Service's full validation ran
    # past 45 minutes and Adaptix-Billing-Service's past 35, legitimately, on
    # the fleet's largest suites. (Adaptix-Web-App's ~19 minutes is its test
    # phase alone.) A 30-40 minute ceiling would have killed real runs and
    # reported them as hangs. Lower this only from a new fleet-wide measurement.
    timeout-minutes: 60
    steps:
      - name: Checkout repository under validation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo

      # Consumers always pin an immutable engine commit. A release wave advances
      # this SHA only after that exact engine revision has passed self-validation
      # and representative canaries. Mutable tags are never validation authority.
      # Currently engine 1.10.0, advanced from 1.9.3 on 2026-09-03 after that
      # exact revision passed adaptix-ops' own gate and five representative
      # canaries -- with the alembic head assertion observed RUNNING in the
      # canary logs, not merely reported green, because the impact plan can
      # exclude gates on a narrow change and a skipped gate proves nothing.
      # (Dated, not "by this commit": consumers receive this text through
      # re-sync PRs that do not move the pin, and the sentence must stay true
      # in both.)
      - name: Validate
        uses: FusionEMS-Quantum-LLC/adaptix-ops/validation@edc1c70e4e0da2bbb26b5d76c3bce7d349aba389
        with:
          repository: ${{ github.repository }}
          target-path: repo
