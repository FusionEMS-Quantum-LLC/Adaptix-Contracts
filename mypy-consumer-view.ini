# Consumer-view type check for the shipped `adaptix_contracts` package.
#
# WHY THIS FILE EXISTS
# --------------------
# pyproject.toml's [tool.mypy] sets `plugins = ["pydantic.mypy"]`. That plugin
# understands Pydantic's own semantics, so it reads
#
#     quantity: int = Field(1, ge=1)
#
# as an OPTIONAL field defaulting to 1 - which is what Pydantic does at
# runtime. The ~73 repositories that consume this package do NOT all enable
# that plugin. Without it, mypy falls back to PEP 681 `dataclass_transform`,
# which recognises only the `default=` / `default_factory=` KEYWORD parameters
# of a field specifier. A POSITIONAL default is therefore invisible to it: the
# synthesised `__init__` parameter stays REQUIRED and every ordinary
# construction in a consumer fails with `Missing named argument "quantity"`.
#
# That is not hypothetical. 503 positional defaults across 42 files (corrected
# in PR #273, merge commit b26b36d4) broke consumers fleet-wide while this
# repository's own gate stayed green from first commit to fix, because the
# plugin-enabled run models a positional default correctly and so is
# STRUCTURALLY unable to observe the breakage. The gate validated a view of
# this package's types that its consumers do not share.
#
# This config re-runs mypy over the shipped package with the plugin OFF, so the
# gate sees what a plugin-less consumer sees. It does NOT replace the
# plugin-enabled run - both views matter, and scripts/ci/verify-toolchain.sh
# runs both.
#
# NOTE ON COVERAGE: this run reports a positional default only where the
# affected model is also CONSTRUCTED inside `adaptix_contracts` (the error is
# `call-arg` at the construction site, never at the declaration). Declaration
# sites are covered instead by tests/test_field_defaults_are_keyword_only.py,
# which walks every model in the package. The two checks are complementary;
# neither replaces the other.

[mypy]
# Deliberately NO `plugins =` entry. That omission IS this file.
# Everything else mirrors [tool.mypy] in pyproject.toml.
ignore_missing_imports = True

# Keep this run's cache separate from the plugin-enabled run's. mypy keys cache
# entries to the active option set, so sharing one directory would make each
# run invalidate the other's entries and re-analyse the tree from scratch.
cache_dir = .mypy_cache_consumer_view

# ---------------------------------------------------------------------------
# NAMED, NARROWLY-SCOPED EXCLUSION - MUST BE REMOVED, NOT WIDENED.
#
# WHAT: `adaptix_contracts/errors/envelope.py` reports 7 pre-existing
# `call-arg` errors under the plugin-less view, one per factory classmethod:
#   Unexpected keyword argument "error_code" for "AdaptixErrorEnvelopeBase"
#
# WHY: `AdaptixErrorEnvelopeBase` deliberately does NOT declare `error_code`;
# each concrete envelope declares its own so domain subpackages can widen the
# code union without the Liskov violation that subclassing would create. The
# reasoning is written out in that class's docstring. The base's seven factory
# helpers nevertheless call `cls(error_code=...)`, which is correct for every
# real caller - they are only ever invoked on a concrete subclass - but is not
# expressible to a checker that sees only the base's own fields.
#
# WHY IT IS NOT FIXED HERE: this is a SEPARATE defect with a different root
# cause from the positional-default class this gate exists to catch. Every
# candidate repair - widening the base's `error_code`, re-declaring it in
# subclasses, or constructing through `cls(**kwargs)` - either reintroduces the
# Liskov problem the docstring rejects or silences errors wholesale. The
# behaviour-preserving fix is to make the base generic in its code type, which
# is a remodel of a contract with nine subclasses and every downstream
# consumer. That is not mechanical and does not belong in this change.
#
# SCOPE: one module, one error code. Everything else in envelope.py is still
# checked, and `call-arg` is still enforced in every other module.
# Positional-default regressions inside envelope.py remain covered by
# tests/test_field_defaults_are_keyword_only.py, which does not go through
# mypy at all.
#
# REMOVE THIS SECTION when the generic remodel lands. Do not add modules to it.
# ---------------------------------------------------------------------------
[mypy-adaptix_contracts.errors.envelope]
disable_error_code = call-arg
