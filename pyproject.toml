[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptix-contracts"
version = "5.6.0"
description = "Shared cross-domain schemas and contracts for the Adaptix platform"
readme = {file = "README.md", content-type = "text/markdown"}
license = "Apache-2.0"
requires-python = ">=3.11"
keywords = ["adaptix", "contracts", "schemas", "pydantic", "ems", "dispatch", "healthcare"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.6.0",
    "fastapi>=0.141.1",
    "httpx>=0.27.0",
    "email-validator>=2.0.0",
    "PyJWT>=2.8.0",
    "cryptography>=50.0.0",
    "SQLAlchemy",
]

# NOT base dependencies:
#   boto3 / botocore / PyYAML are used ONLY by tools/bedrock_ops.py, which
#   `[tool.setuptools.packages.find].exclude` drops from the wheel - so nothing
#   this package SHIPS can import them (0 references under adaptix_contracts/).
#   Declaring them here forced every consumer to install boto3, which pulls
#   botocore and s3transfer, for code it cannot reach. They moved to the `dev`
#   extra because tests/test_bedrock_ops_command_safety.py does exercise that
#   tool, so the repo's own gate still needs them - `uv sync --all-extras`
#   installs them. requirements-bedrock-ci.txt remains their pinned home for
#   the Bedrock CI path.
#   temporalio - see the `temporal` extra below.

[project.urls]
Homepage = "https://github.com/FusionEMS-Quantum-LLC/Adaptix-Contracts"
Repository = "https://github.com/FusionEMS-Quantum-LLC/Adaptix-Contracts"
Changelog = "https://github.com/FusionEMS-Quantum-LLC/Adaptix-Contracts/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "build>=1.2.2.post1,<2",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-asyncio>=0.23.0",
    "twine>=7.0.0,<8",
    "temporalio>=1.7.0,<2.0.0",
    "ruff==0.16.5",
    "mypy==2.3.1",
    # Needed by tests/test_bedrock_ops_command_safety.py, which loads
    # tools/bedrock_ops.py. That tool is excluded from the wheel, so these stay
    # out of the base dependency set - see the note above `dependencies`.
    "boto3>=1.43.71",
    "botocore>=1.43.36",
    "PyYAML>=6.0.3",
]
# Temporal payload codec (adaptix_contracts.temporal). An EXTRA, not a base
# dependency: every Adaptix service imports adaptix_contracts, but only the ones
# that run a Temporal worker or START a workflow need the SDK, and temporalio
# pulls a compiled core. Services that need it install
# `adaptix-contracts[temporal]`; everyone else is unaffected.
#
# Range matches Adaptix-Temporal-Service's own pin so the two cannot resolve to
# incompatible SDK majors â€” they must agree on the Payload/PayloadCodec surface
# this codec is written against.

temporal = [

    "temporalio>=1.7.0,<2.0.0",

]



[tool.pytest.ini_options]

asyncio_mode = "auto"

# Test the SOURCE in this checkout, never a previously-installed copy of

# adaptix_contracts that happens to be on the interpreter's site-packages.

# Without this, `pytest` under an interpreter that has an older adaptix-contracts

# installed validates that stale copy: the suite can pass while the repo source

# is broken, and fail while it is correct. `pythonpath` entries are prepended to

# sys.path, so the checkout always wins.

pythonpath = ["."]



[tool.setuptools]

package-dir = {"" = "."}



[tool.setuptools.packages.find]

where = ["."]

include = ["adaptix_contracts*"]

exclude = ["build*", "dist*", "tests*", "scripts*", "tools*", "docs*"]

namespaces = false



[tool.mypy]

plugins = ["pydantic.mypy"]

ignore_missing_imports = true

# Type-check library/source only. Test files intentionally construct models via

# camelCase aliases (validated at runtime by populate_by_name) which the pydantic

# mypy plugin cannot model on the synthesized __init__; excluding tests scopes

# strict typing to shipped code without hiding any source/production error.

exclude = "(^|/)(tests|build|dist)/"


[tool.ruff]
# EXPLICIT, PINNED CONFIGURATION - do not remove.
#
# Until now this repository declared NO [tool.ruff] table at all, so `ruff check`
# enforced whatever rule set the installed ruff version happened to default to.
# Ruff 0.16.0 (2026-07-23) grew that built-in default from 59 rules to 413; on
# unchanged source that is 2371 findings across 29 rules under the ruff 0.16.4
# pinned in [project.optional-dependencies].dev - and ZERO of them in
# E4/E7/E9/F. The entire delta was default-set drift, not code rot. Selecting
# explicitly makes `ruff check` depend on this file rather than on ruff's
# release notes.
#
# `line-length` is deliberately NOT set. Adaptix-Core-Service and
# Adaptix-Billing-Service both set 120, but that knob is shared with
# `ruff format`, and this tree was formatted (commit 5cc18303) under ruff's
# default of 88 with `ruff format --check` currently passing. Raising it here
# would reflow shipped source and break a green formatter gate for no lint
# benefit - E501 is not in the selected set. Adopt 120 only together with a
# reformat commit.
#
# `target-version` is pinned to the FLOOR this library supports, not the runtime
# it is developed against. repo.yaml declares runtime.target "3.12" but
# runtime.compatibility ">=3.11", and `requires-python` above is ">=3.11": this
# package is installed into services still on 3.11. ruff's target-version means
# "minimum supported version", so py311 is correct and is identical to what ruff
# infers from requires-python today. Pinning only stops that from drifting
# silently if requires-python changes.
target-version = "py311"

[tool.ruff.lint]
# These four prefixes are exactly ruff's pre-0.16 default selection, and exactly
# what Adaptix-Core-Service (core/backend/.ruff.toml - the authoritative file
# there, which shadows its own pyproject table) and Adaptix-Billing-Service
# (backend/pyproject.toml) both declare. This is the house rule set.
select = ["E4", "E7", "E9", "F"]

# No `ignore` list. Core and Billing each carry one (E402/F841/E712/E741/F811),
# but those suppress findings that genuinely exist in those trees. This tree has
# ZERO findings in the selected set, so importing their ignores would silently
# pre-authorize defect classes this repository does not have.
#
# Rules that ruff 0.16.4's expanded default DID report here and that the
# selection above does not enforce, tracked as deliberate follow-up work (one
# category per PR, gate green after each):
#   DTZ005  x6  naive datetime.now()            - validate_contracts.py
#   BLE001  x6  blind `except Exception`        - 3 in shipped
#                                                 adaptix_contracts/supply_integrations.py
#   B008    x7  function call in default arg    - adaptix_contracts/auth/rbac_dependencies.py
#                                                 (FastAPI Depends() idiom; likely false positive)
#   PLW1510 x1  subprocess.run without check=
#   S112    x1  try/except/continue
#   B017    x2  assert-raises-Exception in tests
#   RUF012  x5  mutable class default
