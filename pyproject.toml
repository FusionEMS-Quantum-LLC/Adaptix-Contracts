[build-system]
requires = ["setuptools>=82.0.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptix-contracts"
version = "2.2.0"
description = "Shared cross-domain schemas and contracts for the Adaptix platform"
readme = {file = "README.md", content-type = "text/markdown"}
license = "Apache-2.0"
requires-python = ">=3.11"
keywords = ["adaptix", "contracts", "schemas", "pydantic", "ems", "dispatch", "healthcare"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.6.0",
    "fastapi>=0.138.2",
    "httpx>=0.27.0",
    "email-validator>=2.0.0",
    "PyJWT>=2.8.0",
    "cryptography>=49.0.0",
    "PyYAML",
    "SQLAlchemy",
    "boto3",
]

[project.urls]
Homepage = "https://github.com/FusionEMS-Quantum-LLC/Adaptix-Contracts"
Repository = "https://github.com/FusionEMS-Quantum-LLC/Adaptix-Contracts"
Changelog = "https://github.com/FusionEMS-Quantum-LLC/Adaptix-Contracts/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "build>=1.2.2.post1,<2",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-asyncio>=0.23.0",
    "twine>=6.1.0,<7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["adaptix_contracts*"]
exclude = ["build*", "dist*", "tests*", "scripts*", "tools*", "docs*"]
namespaces = false

[tool.mypy]
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
# Type-check library/source only. Test files intentionally construct models via
# camelCase aliases (validated at runtime by populate_by_name) which the pydantic
# mypy plugin cannot model on the synthesized __init__; excluding tests scopes
# strict typing to shipped code without hiding any source/production error.
exclude = "(^|/)tests/"

[tool.ruff.lint]
# Pin the lint rule set to ruff's historical default (E4/E7/E9/F) so the
# enforced ruleset is deterministic across ruff versions and identical between
# the pinned CodeBuild gate (ruff==0.15.22, see .codebuild/pr-validation.yml)
# and any newer ruff that CI/Codacy may run. Without this, ruff 0.16.0 (which
# expanded the default set to include I/UP/B/RUF... e.g. UP045 on Optional[X])
# flags pre-existing repo style (the package consistently uses typing.Optional)
# that the pinned gate accepts, breaking local==remote. This re-declares the
# existing default (a no-op under 0.15.22); it does not silence a real defect.
# A deliberate rule-set expansion should bump the pin and fix the delta in its
# own PR. Matches Adaptix-Terminology-Service backend/pyproject.toml.
select = ["E4", "E7", "E9", "F"]
