# main-validation — authoritative main-branch/release-readiness gate for
# Adaptix-Contracts.
#
# Fires on: PUSH to main (wired centrally by adaptix-ops / CodeBuild fleet).
# Owns:     full lint + format + typecheck + unit tests + validator JSON +
#           buildable/publishable package artifacts.
# Does NOT run deployment from GitHub Actions; this repo's release/deploy
# authority is CodeBuild-only.

version: 0.2

env:
  shell: bash
  variables:
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
    UV_VERSION: "0.12.3"
    UV_SHA256: "600cf9a742aca00d292673b16b5acffaa7b8c269a364ad0c2e79498dcb1fe101"
    PYTHONDONTWRITEBYTECODE: "1"
    PYTHONUNBUFFERED: "1"
    # main-validation uses the same clean-container install strategy as
    # pr-validation; secrets/deps/install are handled by sibling buildspecs and
    # the install phase below.
    ADAPTIX_CI_SKIP: "secrets,deps,install"

phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - python --version
      - |
        set -e
        curl -sSfL -o /tmp/uv.tgz \
          "https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/uv-x86_64-unknown-linux-gnu.tar.gz"
        echo "${UV_SHA256}  /tmp/uv.tgz" | sha256sum -c -
        tar -C /usr/local/bin --strip-components=1 -xzf /tmp/uv.tgz \
          uv-x86_64-unknown-linux-gnu/uv uv-x86_64-unknown-linux-gnu/uvx
        uv --version
      - uv pip install --system --quiet 'ruff==0.15.22' mypy pytest pytest-asyncio pytest-cov aiosqlite httpx build twine
      - |
        for BD in core/backend backend .; do
          if [ -f "$BD/pyproject.toml" ]; then
            uv pip install --system --quiet -e "$BD"
            uv pip install --system --quiet -e "$BD[test]" 2>/dev/null || true
            uv pip install --system --quiet -e "$BD[dev]"  2>/dev/null || true
            break
          fi
        done
      - |
        for f in $(find . -maxdepth 3 -name "requirements*.txt" -not -path "*/node_modules/*" -not -path "*/.git/*"); do
          uv pip install --system --quiet -r "$f"
        done
      - |
        set -e
        if command -v pyenv >/dev/null 2>&1; then pyenv rehash || true; fi
        export PATH="$(python -c 'import sysconfig; print(sysconfig.get_path("scripts"))'):$PATH"
        for tool in python ruff pytest twine; do
          command -v "$tool" >/dev/null 2>&1 || {
            echo "GATE TOOLCHAIN MISSING: $tool is not on PATH after install." >&2
            exit 1
          }
        done
        ruff --version
        pytest --version
        python -m build --version
        twine --version

  pre_build:
    commands:
      - echo "=== Repo state ==="
      - git rev-parse HEAD
      - git status --short

  build:
    commands:
      - chmod +x scripts/local-ci.sh
      - bash scripts/local-ci.sh python full
      - python validate_contracts.py --json
      - python -m build --sdist --wheel
      - python -m twine check dist/*
      - |
        if [ -n "${ADAPTIX_CONTRACTS_WORKSPACE_ROOT:-}" ]; then
          python scripts/audit_workspace_contracts.py \
            --workspace-root "${ADAPTIX_CONTRACTS_WORKSPACE_ROOT}"
        else
          echo "Workspace audit skipped: ADAPTIX_CONTRACTS_WORKSPACE_ROOT is not set."
        fi

cache:
  paths:
    - "/root/.cache/uv/**/*"
    - ".mypy_cache/**/*"
    - ".ruff_cache/**/*"
