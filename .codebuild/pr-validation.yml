# pr-validation — canonical Python-service gate for Adaptix-Contracts.
#
# Fires on: PULL_REQUEST_CREATED | PULL_REQUEST_UPDATED | PULL_REQUEST_REOPENED
# Owns:     lint + format + typecheck + fast unit tests
# Slow tests, integration suites, deploy gates → other buildspecs.
#
# Provisioned by terraform/environments/prod/codebuild_core_service_gates.tf
# via the codebuild_repo_gates module. Renaming this file requires a Terraform
# update — keep the buildspec key in sync.

version: 0.2

env:
  shell: bash
  variables:
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
    UV_VERSION: "0.12.3"
    UV_SHA256: "600cf9a742aca00d292673b16b5acffaa7b8c269a364ad0c2e79498dcb1fe101"
    PYTHONDONTWRITEBYTECODE: "1"
    PYTHONUNBUFFERED: "1"
    # CodeBuild provides a clean checkout; secrets/deps/install are handled
    # by the install phase below, so skip those local-ci.sh stages here.
    ADAPTIX_CI_SKIP: "secrets,deps,install"
    # Run pytest with -n auto (pytest-xdist) to parallelise across all vCPUs.
    # Cuts 2 800-test suite from ~18 min to ~4 min on a 4-vCPU standard:7.0
    # instance. main-validation intentionally omits this flag so the full
    # sequential run remains the authoritative pre-deploy signal.
    ADAPTIX_CI_PARALLEL: "1"

phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - python --version
      # uv replaces the pip dependency install. MEASURED on this gate (CodeBuild
      # adaptixcore-epcr-service-pr-validation build a35bfb20, 2026-08-13): the
      # identical dependency set resolves in 12s under uv against 64s before,
      # and the INSTALL phase drops from 64s to 2s. --system targets the
      # CodeBuild-managed interpreter, so ruff, mypy, pytest and
      # scripts/local-ci.sh resolve exactly the environment they resolved
      # before. The package set, version pins and lockfiles are unchanged, so a
      # green build still means what it meant.
      #
      # Pinned and digest-verified for the same reason security-scan.yml pins
      # gitleaks: this binary is unpacked into /usr/local/bin and executed as
      # root in a build container that carries deploy credentials, and it is
      # the component that installs every other dependency -- a substituted
      # artifact could rewrite the entire dependency set silently. BUMP
      # UV_VERSION AND UV_SHA256 TOGETHER; a version bump against a stale
      # digest fails the install phase closed, which is the intended behaviour.
      # 'set -e' is what makes it fail closed: inside a '- |' block CodeBuild
      # reads only the exit status of the LAST command, so without it a digest
      # mismatch is printed and then ignored.
      - |
        set -e
        curl -sSfL -o /tmp/uv.tgz \
          "https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/uv-x86_64-unknown-linux-gnu.tar.gz"
        echo "${UV_SHA256}  /tmp/uv.tgz" | sha256sum -c -
        tar -C /usr/local/bin --strip-components=1 -xzf /tmp/uv.tgz \
          uv-x86_64-unknown-linux-gnu/uv uv-x86_64-unknown-linux-gnu/uvx
        uv --version
      # Tooling + common platform test deps. aiosqlite + httpx are used by
      # async test suites across every service and are frequently declared
      # under a [dev] extra rather than [test], so install them explicitly
      # to guarantee pytest's clean-container imports resolve.
      #
      # ruff is PINNED. It was previously unpinned, so ruff 0.16.0 (published
      # 2026-07-23T19:10Z) landed mid-flight and expanded the default rule set
      # (I001/UP045/BLE001/FLY002/RUF022 now fire by default). Measured with a
      # clean `ruff==0.16.0` venv and --no-cache, `ruff check .` reports 1606
      # violations on main @23d631d itself — i.e. an upstream release broke
      # every open PR in this repo overnight without a single line of repo code
      # changing. 0.15.22 (published 2026-07-16) is the last version before that
      # change and is the version the last green build (PR #111, 2026-07-19)
      # ran on, so this pin restores the exact previously-enforced gate rather
      # than relaxing it. Bump deliberately, with the rule-set delta reviewed
      # and the resulting violations fixed in their own PR.
      - uv pip install --system --quiet 'ruff==0.15.22' mypy pytest pytest-asyncio pytest-cov pytest-xdist aiosqlite httpx
      - |
        # Install the backend package + its test/dev extras so pytest's full
        # dependency set is present in CodeBuild's clean container. Repos vary
        # ([test] vs [dev]); try both — an absent extra is fine, but a genuine
        # package build failure surfaces (no blanket mask on the base install).
        for BD in core/backend backend .; do
          if [ -f "$BD/pyproject.toml" ]; then
            uv pip install --system --quiet -e "$BD"
            uv pip install --system --quiet -e "$BD[test]" 2>/dev/null || true
            uv pip install --system --quiet -e "$BD[dev]"  2>/dev/null || true
            break
          fi
        done
      - |
        # Any requirements files (dev/test) the repo ships.
        for f in $(find . -maxdepth 3 -name "requirements*.txt" -not -path "*/node_modules/*" -not -path "*/.git/*"); do
          uv pip install --system --quiet -r "$f" || true
        done

      - |
        set -e
        # uv does not rehash pyenv shims the way pip does, so newly installed
        # console scripts (ruff, mypy, pytest) are importable but not on PATH.
        # Rehash, then fall back to the interpreter's own script dir.
        if command -v pyenv >/dev/null 2>&1; then pyenv rehash || true; fi
        export PATH="$(python -c 'import sysconfig; print(sysconfig.get_path("scripts"))'):$PATH"
        # Fail CLOSED if the gate toolchain is not resolvable. scripts/local-ci.sh
        # reports a missing pytest as "[CHECK test] SKIPPED", which would let this
        # gate report success without running a single test.
        for tool in ruff pytest; do
          command -v "$tool" >/dev/null 2>&1 || {
            echo "GATE TOOLCHAIN MISSING: $tool is not on PATH after install." >&2
            echo "Refusing to run a gate that would silently skip its own checks." >&2
            exit 1
          }
        done
        ruff --version
        pytest --version

  pre_build:
    commands:
      - echo "=== Repo state ==="
      - git rev-parse HEAD
      - git status --short

  build:
    commands:
      - chmod +x scripts/local-ci.sh
      - bash scripts/local-ci.sh python

cache:
  paths:
    - "/root/.cache/pip/**/*"
    - ".mypy_cache/**/*"
    - ".ruff_cache/**/*"
